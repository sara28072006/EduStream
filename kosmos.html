<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream - Galaktyka Wiedzy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        .header {
            text-align: center;
            opacity: 0;
            animation: fadeInDown 1.5s ease 0.5s forwards;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .instruction {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseText 2s infinite;
        }

        #planetLabel{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,120px);
            font-size:22px;
            font-weight:700;
            opacity:0;
            transition:opacity 0.25s, transform 0.25s;
            pointer-events:none;
            text-shadow:0 4px 20px rgba(0,0,0,0.9);
            color: white;
            z-index: 20;
            letter-spacing: 0.6px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            padding: 8px 16px;
            border-radius: 14px;
            backdrop-filter: blur(6px) saturate(120%);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 18px;
            z-index: 100;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.12);
            border-top-color: rgba(255,255,255,0.8);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #hintReset {
            position: absolute;
            bottom: 22px;
            right: 22px;
            z-index: 20;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 600px){
            .header h1 { font-size: 28px; }
            #planetLabel { font-size: 16px; transform: translate(-50%, 90px); }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div class="ui-layer">
        <div class="header">
            <h1>Galaktyka Wiedzy</h1>
            <p>Wybierz swój świat</p>
        </div>
        <div class="instruction">
            Nakieruj kursor na planetę i kliknij
        </div>

        <div id="planetLabel"></div>
    </div>

    <div id="loading"><div class="spinner"></div><div id="loadingText">Ładowanie galaktyki...</div></div>
    <div id="hintReset">Naciśnij <strong>Esc</strong>, aby wrócić</div>

    <audio id="spaceSound" loop preload="auto">
        <source src="space.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#000000');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // STARS (3 layers)
        function createStarField(count, spread) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * spread;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                size: 0.04,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });
            return new THREE.Points(geometry, material);
        }

        const starMeshes = [];
        starMeshes.push({mesh: createStarField(1800, 40), speed: 0.012, axisX: 0.01});
        starMeshes.push({mesh: createStarField(3200, 80), speed: 0.007, axisX: 0.004});
        starMeshes.push({mesh: createStarField(6000, 140), speed: 0.003, axisX: 0.002});
        starMeshes.forEach(s => scene.add(s.mesh));

        // LIGHTING
        const ambientLight = new THREE.AmbientLight(0x222233, 0.4);
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0x4466ff, 0x110033, 0.6);
        scene.add(hemiLight);
        const keyLight = new THREE.DirectionalLight(0xfff5e6, 4.0);
        keyLight.position.set(5, 5, 5);
        scene.add(keyLight);
        const rimLight = new THREE.DirectionalLight(0x88ccff, 3.5);
        rimLight.position.set(-8, 5, -8);
        scene.add(rimLight);
        const fillLight = new THREE.DirectionalLight(0x555566, 1.0);
        fillLight.position.set(0, -5, 2);
        scene.add(fillLight);

        // LOADING
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const loadingManager = new THREE.LoadingManager();
        loadingManager.onStart = function(url, itemsLoaded, itemsTotal) {
            loadingText.innerText = `Ładowanie (${itemsLoaded}/${itemsTotal})...`;
        };
        loadingManager.onProgress = function(url, itemsLoaded, itemsTotal) {
            loadingText.innerText = `Ładowanie (${itemsLoaded}/${itemsTotal})...`;
        };
        loadingManager.onLoad = function() {
            setTimeout(() => {
                loadingDiv.style.opacity = 0;
                setTimeout(()=> loadingDiv.style.display = 'none', 600);
            }, 300);
        };
        loadingManager.onError = function(url) {
            loadingText.innerText = `Błąd ładowania zasobu.`;
            console.error('Loading error:', url);
        };

        const loader = new GLTFLoader(loadingManager);
        const textureLoader = new THREE.TextureLoader(loadingManager);

        // Nebula sprites (lighter + animating)
        const nebulaTex = textureLoader.load('https://threejs.org/examples/textures/lensflare/lensflare0.png');
        const nebulaMaterial = new THREE.SpriteMaterial({
            map: nebulaTex,
            color: 0x8a66ff,      // lekko jaśniejszy fiolet
            transparent: true,
            opacity: 0.12,        // ZMNIEJSZONA OPACZNOŚĆ -> lżejszy efekt
            depthWrite: false
        });

        const nebulaSprites = [];
        for (let i = 0; i < 18; i++) {
            const sprite = new THREE.Sprite(nebulaMaterial.clone());
            const origX = (Math.random() - 0.5) * 60;
            const origY = (Math.random() - 0.5) * 30;
            const origZ = (Math.random() - 0.5) * 60;
            sprite.position.set(origX, origY, origZ);
            const scale = Math.random() * 12 + 6;
            sprite.scale.set(scale, scale, 1);
            sprite.material.rotation = Math.random() * Math.PI;
            // store original position + unique phase/speed
            sprite.userData = { origX, origY, origZ, phase: Math.random() * Math.PI * 2, speed: 0.08 + Math.random() * 0.12, amp: 0.6 + Math.random() * 1.6 };
            scene.add(sprite);
            nebulaSprites.push(sprite);
        }

        // Planets
        const planets = [];

        function createPlanet(path, position, baseScale, name) {
            const planetGroup = new THREE.Group();
            planetGroup.position.set(...position);
            planetGroup.scale.setScalar(baseScale);

            planetGroup.userData = {
                name: name,
                baseScale: baseScale,
                targetScale: baseScale,
                isHovered: false
            };

            const placeholderGeo = new THREE.SphereGeometry(1, 32, 32);
            const placeholderMat = new THREE.MeshBasicMaterial({
                color: 0xd946ef,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const placeholder = new THREE.Mesh(placeholderGeo, placeholderMat);
            planetGroup.add(placeholder);

            // DODAWANIE ORBIT: pomijamy ring dla Ziemi (nazwa zawiera "Ziemia")
            const addOrbit = !name.toLowerCase().includes('ziemia');

            if (addOrbit) {
                const ringRadius = Math.max(1.4, baseScale * 1.8 + Math.abs(planetGroup.position.x) * 0.05);
                const orbitGeo = new THREE.RingGeometry(ringRadius, ringRadius + 0.02, 64);
                const orbitMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.06,
                    side: THREE.DoubleSide
                });
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = Math.PI / 2;
                orbit.position.set(0, -0.2, 0);
                planetGroup.add(orbit);
            }
            // loader
            loader.load(path, (gltf) => {
                planetGroup.remove(placeholder);
                const model = gltf.scene;
                model.position.set(0, 0, 0);
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (child.material.roughness !== undefined) child.material.roughness = 0.4;
                        if (child.material.metalness !== undefined) child.material.metalness = 0.1;
                        child.material.needsUpdate = true;
                    }
                });
                planetGroup.add(model);

                // Atmosphere glow: POMIJAMY dla Ziemi (usuń poświatę białą koło ziemi)
                const addGlow = !name.toLowerCase().includes('ziemia');
                if (addGlow) {
                    const glowGeometry = new THREE.SphereGeometry(1.18, 32, 32);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: 0x66ccff,
                        transparent: true,
                        opacity: 0.14,
                        side: THREE.BackSide,
                        depthWrite: false
                    });
                    const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                    glowMesh.scale.setScalar(1.0);
                    planetGroup.add(glowMesh);
                    // store reference for per-planet subtle animation:
                    planetGroup.userData.glowMesh = glowMesh;
                }

                // thin cloud layer (kept)
                const cloudGeo = new THREE.SphereGeometry(1.02, 24, 24);
                const cloudMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff, transparent: true, opacity: 0.03, side: THREE.DoubleSide, depthWrite: false
                });
                const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
                planetGroup.add(cloudMesh);

            }, undefined, (error) => {
                console.error(`Nie udało się załadować modelu ${path}:`, error);
            });

            scene.add(planetGroup);
            planets.push(planetGroup);
        }

        // ZWIĘKSZONE ODLEGŁOŚCI MIĘDZY PLANETAMI (bardziej rozstawione)
        createPlanet('./neptun.glb', [-5, 0, -3], 0.1, 'Neptun (Wrażliwość)');
        createPlanet('./ziemia.glb', [0, 0, 0], 1.5, 'Ziemia (Inspiracja)');
        createPlanet('./mars.glb', [5, 0, -3], 0.4, 'Mars (Działanie)');

        // INTERACTIONS
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const planetLabel = document.getElementById("planetLabel");
        const spaceAudio = document.getElementById('spaceSound');
        let audioStarted = false;
        function tryStartAudio() {
            if (!audioStarted) {
                audioStarted = true;
                spaceAudio.volume = 0.18;
                spaceAudio.play().catch(err => console.warn('Autoplay blocked:', err));
            }
        }

        let targetPlanet = null;
        window.addEventListener('click', () => {
            const hoveredPlanet = planets.find(p => p.userData.isHovered);
            if (hoveredPlanet) {
                alert(`Rozpoczynamy podróż na: ${hoveredPlanet.userData.name}!`);
                targetPlanet = hoveredPlanet;
                tryStartAudio();
            } else {
                tryStartAudio();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                targetPlanet = null;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // animate star layers
            starMeshes.forEach((s, i) => {
                s.mesh.rotation.y = time * (s.speed * 10);
                s.mesh.rotation.x = time * (s.axisX * 4);
            });

            // animate nebula sprites (delikatny ruch: oscylacja wokół oryginalnej pozycji)
            nebulaSprites.forEach((spr, i) => {
                const ud = spr.userData;
                // lekkie przesunięcie w osi X i Y, zależne od czasu (gładkie)
                spr.position.x = ud.origX + Math.sin(time * ud.speed + ud.phase) * ud.amp;
                spr.position.y = ud.origY + Math.cos(time * (ud.speed * 0.9) + ud.phase * 0.7) * (ud.amp * 0.4);
                // i delikatna rotacja materialu
                spr.material.rotation = Math.sin(time * 0.2 + ud.phase) * 0.4;
            });

            raycaster.setFromCamera(mouse, camera);
            let anyHovered = false;

            planets.forEach((planetGroup, idx) => {
                planetGroup.rotation.y += delta * (0.2 + idx * 0.02);
                planetGroup.position.y += Math.sin(time + planetGroup.position.x) * 0.002;

                const intersects = raycaster.intersectObject(planetGroup, true);

                if (intersects.length > 0) {
                    planetGroup.userData.targetScale = planetGroup.userData.baseScale * 1.08;
                    planetGroup.userData.isHovered = true;
                    anyHovered = true;
                    planetLabel.innerText = planetGroup.userData.name;
                    planetLabel.style.opacity = 1;
                    planetLabel.style.transform = 'translate(-50%, 100px) scale(1)';
                } else {
                    planetGroup.userData.targetScale = planetGroup.userData.baseScale;
                    planetGroup.userData.isHovered = false;
                }

                const currentScale = planetGroup.scale.x;
                const newScale = currentScale + (planetGroup.userData.targetScale - currentScale) * 0.12;
                planetGroup.scale.setScalar(newScale);

                // subtle animation for glow meshes (if present) - powolne pulsowanie / przesunięcie
                if (planetGroup.userData.glowMesh) {
                    // powolna zmiana przezroczystości i lekkie przesunięcie skali glow
                    const g = planetGroup.userData.glowMesh;
                    const pulse = 0.02 * Math.sin(time * 0.9 + idx);
                    g.material.opacity = 0.12 + Math.abs(pulse); // delikatne pulsowanie
                    g.rotation.y = time * 0.05 * (idx + 1); // slow rotation to feel 'moving'
                }
            });

            document.body.style.cursor = anyHovered ? 'pointer' : 'default';
            if (!anyHovered && planetLabel) planetLabel.style.opacity = 0;

            // camera parallax (mouse)
            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 0.5 - camera.position.y) * 0.05;

            if (targetPlanet) {
                const targetPosition = targetPlanet.getWorldPosition(new THREE.Vector3());
                const desiredCamPos = new THREE.Vector3(
                    targetPosition.x,
                    targetPosition.y,
                    targetPosition.z + (1.8 * targetPlanet.userData.baseScale) + 1.8
                );
                camera.position.lerp(desiredCamPos, 0.06);
                camera.lookAt(targetPosition);
            } else {
                camera.lookAt(0, 0, 0);
                camera.position.z += (8 - camera.position.z) * 0.02;
            }

            renderer.render(scene, camera);
        }

        animate();

        console.log('Zmiany: usunięty ring i glow dla Ziemi; fioletowe mgławice lżejsze i poruszające się; planety bardziej rozstawione.');
    </script>
</body>
</html>
